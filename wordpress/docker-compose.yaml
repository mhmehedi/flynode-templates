services:
  wordpress:
    image: 'wordpress:latest'
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: '${WORDPRESS_DB_PASSWORD}'
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-files:/var/www/html
    depends_on:
      - mariadb
    restart: unless-stopped
  # Web file manager (dufs) on the same volume as WordPress. Runs as
  # www-data (uid/gid 33, what the wordpress image uses) so anything
  # uploaded here is owned by, and writable for, WordPress. Login is
  # `admin` + FILE_MANAGER_PASSWORD; symlinks out of the site folder are
  # not followed (dufs default).
  filemanager:
    image: 'sigoden/dufs:latest'
    user: '33:33'
    command: ['/data', '--allow-all']
    # Tells Traefik which port to route to — dufs' image declares none.
    expose:
      - '5000'
    environment:
      DUFS_AUTH: 'admin:${FILE_MANAGER_PASSWORD}@/:rw'
    volumes:
      - wordpress-files:/data
    depends_on:
      - wordpress
    restart: unless-stopped
  mariadb:
    image: 'mariadb:11'
    environment:
      MYSQL_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: '${WORDPRESS_DB_PASSWORD}'
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  wordpress-files:
  mariadb-data:
