services:
  matomo:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'matomo:latest'
    environment:
      MATOMO_DATABASE_HOST: 'db'
      MATOMO_DATABASE_USERNAME: 'matomo'
      MATOMO_DATABASE_PASSWORD: '${MATOMO_DB_PASSWORD}'
      MATOMO_DATABASE_DBNAME: 'matomo'
    expose:
      - '80'
    volumes:
      - matomo-data:/var/www/html

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mariadb:11'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--innodb-buffer-pool-size=256M', '--aria-pagecache-buffer-size=8M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: 'matomo'
      MARIADB_USER: 'matomo'
      MARIADB_PASSWORD: '${MATOMO_DB_PASSWORD}'
    volumes:
      - matomo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  matomo-data:
  matomo-db-data:
