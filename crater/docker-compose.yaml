services:
  crater:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'wrkflow/crater:latest'
    environment:
      APP_KEY: '${CRATER_APP_KEY}'
      DB_HOST: 'db'
      DB_DATABASE: 'crater'
      DB_USERNAME: 'crater'
      DB_PASSWORD: '${CRATER_DB_PASSWORD}'
    expose:
      - '80'
    volumes:
      - crater-storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mysql:8.0'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--performance-schema=OFF', '--innodb-buffer-pool-size=128M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: 'crater'
      MYSQL_USER: 'crater'
      MYSQL_PASSWORD: '${CRATER_DB_PASSWORD}'
    volumes:
      - crater-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  crater-storage:
  crater-db-data:
