services:
  crater:
    image: 'wrkflow/crater:latest'
    environment:
      APP_KEY: '${CRATER_APP_KEY}'
      DB_HOST: 'db'
      DB_DATABASE: 'crater'
      DB_USERNAME: 'crater'
      DB_PASSWORD: '${CRATER_DB_PASSWORD}'
    expose:
      - '80'
    volumes:
      - crater-storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: 'mysql:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: 'crater'
      MYSQL_USER: 'crater'
      MYSQL_PASSWORD: '${CRATER_DB_PASSWORD}'
    volumes:
      - crater-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  crater-storage:
  crater-db-data:
