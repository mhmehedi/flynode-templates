services:
  ghost:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'ghost:5-alpine'
    environment:
      database__client: mysql
      database__connection__host: mysql
      database__connection__user: ghost
      database__connection__password: '${GHOST_DB_PASSWORD}'
      database__connection__database: ghost
      url: '${GHOST_URL}'
    volumes:
      - ghost-content:/var/lib/ghost/content
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mysql:8.0'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--performance-schema=OFF', '--innodb-buffer-pool-size=128M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: '${GHOST_DB_PASSWORD}'
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  ghost-content:
  mysql-data:
