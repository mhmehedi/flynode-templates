services:
  huginn:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'huginn/huginn:latest'
    environment:
      DATABASE_ADAPTER: 'mysql2'
      DATABASE_HOST: 'db'
      DATABASE_NAME: 'huginn'
      DATABASE_USERNAME: 'huginn'
      DATABASE_PASSWORD: '${HUGINN_DB_PASSWORD}'
      APP_SECRET_TOKEN: '${HUGINN_APP_SECRET_TOKEN}'
    expose:
      - '3000'
    volumes:
      - huginn-data:/var/lib/huginn

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mariadb:11'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--innodb-buffer-pool-size=128M', '--aria-pagecache-buffer-size=8M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: 'huginn'
      MARIADB_USER: 'huginn'
      MARIADB_PASSWORD: '${HUGINN_DB_PASSWORD}'
    volumes:
      - huginn-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  huginn-data:
  huginn-db-data:
