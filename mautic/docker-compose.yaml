services:
  mautic:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mautic/mautic:latest'
    environment:
      MAUTIC_DB_HOST: 'db'
      MAUTIC_DB_NAME: 'mautic'
      MAUTIC_DB_USER: 'mautic'
      MAUTIC_DB_PASSWORD: '${MAUTIC_DB_PASSWORD}'
    expose:
      - '80'
    volumes:
      - mautic-data:/var/www/html

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mariadb:11'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--innodb-buffer-pool-size=128M', '--aria-pagecache-buffer-size=8M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: 'mautic'
      MARIADB_USER: 'mautic'
      MARIADB_PASSWORD: '${MAUTIC_DB_PASSWORD}'
    volumes:
      - mautic-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mautic-data:
  mautic-db-data:
