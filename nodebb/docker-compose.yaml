services:
  nodebb:
    image: 'nodebb/docker:latest'
    environment:
      NODEBB_URL: '${NODEBB_URL}'
      NODEBB_DB: 'mongo'
      NODEBB_DB_HOST: 'db'
      NODEBB_DB_NAME: 'nodebb'
      NODEBB_DB_PASSWORD: '${MONGO_INITDB_ROOT_PASSWORD}'
      NODEBB_DB_USER: 'root'
    expose:
      - '4567'
    volumes:
      - nodebb-data:/usr/src/app/public/uploads

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: 'mongo:7'
    environment:
      MONGO_INITDB_ROOT_PASSWORD: '${MONGO_INITDB_ROOT_PASSWORD}'
      MONGO_INITDB_ROOT_USERNAME: 'nodebb'
    volumes:
      - nodebb-db-data:/data/db
    healthcheck:
      test: ["CMD-SHELL","mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  nodebb-data:
  nodebb-db-data:
