services:
  fathom:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'usefathom/fathom:latest'
    environment:
      FATHOM_DATABASE_DRIVER: 'mysql'
      FATHOM_DATABASE_HOST: 'db'
      FATHOM_DATABASE_NAME: 'fathom'
      FATHOM_DATABASE_USER: 'fathom'
      FATHOM_DATABASE_PASSWORD: '${FATHOM_DB_PASSWORD}'
      FATHOM_SECRET: '${FATHOM_SECRET}'
    expose:
      - '8080'

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mysql:8.0'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--performance-schema=OFF', '--innodb-buffer-pool-size=128M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: 'fathom'
      MYSQL_USER: 'fathom'
      MYSQL_PASSWORD: '${FATHOM_DB_PASSWORD}'
    volumes:
      - fathom-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  fathom-db-data:
