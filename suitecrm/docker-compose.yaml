services:
  suitecrm:
    image: 'bitnamilegacy/suitecrm:latest'
    environment:
      SUITECRM_DATABASE_HOST: 'db'
      SUITECRM_DATABASE_NAME: 'suitecrm'
      SUITECRM_DATABASE_USER: 'suitecrm'
      SUITECRM_DATABASE_PASSWORD: '${SUITECRM_DB_PASSWORD}'
      SUITECRM_USERNAME: 'admin'
      SUITECRM_PASSWORD: '${SUITECRM_ADMIN_PASSWORD}'
    expose:
      - '8080'
    volumes:
      - suitecrm-data:/bitnami/suitecrm

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: 'mariadb:11'
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: 'suitecrm'
      MARIADB_USER: 'suitecrm'
      MARIADB_PASSWORD: '${SUITECRM_DB_PASSWORD}'
    volumes:
      - suitecrm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  suitecrm-data:
  suitecrm-db-data:
