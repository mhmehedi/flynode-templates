services:
  suitecrm:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'bitnamilegacy/suitecrm:latest'
    environment:
      SUITECRM_DATABASE_HOST: 'db'
      SUITECRM_DATABASE_NAME: 'suitecrm'
      SUITECRM_DATABASE_USER: 'suitecrm'
      SUITECRM_DATABASE_PASSWORD: '${SUITECRM_DB_PASSWORD}'
      SUITECRM_USERNAME: 'admin'
      SUITECRM_PASSWORD: '${SUITECRM_ADMIN_PASSWORD}'
    expose:
      - '8080'
    volumes:
      - suitecrm-data:/bitnami/suitecrm

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    cgroup_parent: '${FN_CGROUP_PARENT:-system.slice}'
    image: 'mariadb:11'
    # Lean start-up settings (FlyNode): the stock defaults are sized for a big server and hold hundreds of MB for a small app.
    command: ['--innodb-buffer-pool-size=128M', '--aria-pagecache-buffer-size=8M', '--innodb-log-buffer-size=4M', '--max-connections=60', '--table-open-cache=400', '--table-definition-cache=400', '--thread-cache-size=8', '--key-buffer-size=8M', '--tmp-table-size=16M', '--max-heap-table-size=16M']
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: 'suitecrm'
      MARIADB_USER: 'suitecrm'
      MARIADB_PASSWORD: '${SUITECRM_DB_PASSWORD}'
    volumes:
      - suitecrm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  suitecrm-data:
  suitecrm-db-data:
