services:
  invoiceninja:
    image: 'invoiceninja/invoiceninja-debian:latest'
    environment:
      APP_ENV: production
      APP_KEY: '${INVOICENINJA_APP_KEY}'
      DB_HOST: 'db'
      DB_DATABASE: 'ninja'
      DB_USERNAME: 'ninja'
      DB_PASSWORD: '${INVOICENINJA_DB_PASSWORD}'
      APP_URL: '${INVOICENINJA_URL}'
    expose:
      - '80'
    volumes:
      - invoiceninja-data:/var/www/app/storage

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: 'mysql:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: 'ninja'
      MYSQL_USER: 'ninja'
      MYSQL_PASSWORD: '${INVOICENINJA_DB_PASSWORD}'
    volumes:
      - invoiceninja-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  invoiceninja-data:
  invoiceninja-db-data:
