services:
  flarum:
    image: 'mondedie/flarum:latest'
    environment:
      FORUM_URL: '${FLARUM_URL}'
      DB_HOST: 'db'
      DB_NAME: 'flarum'
      DB_USER: 'flarum'
      DB_PASS: '${FLARUM_DB_PASSWORD}'
      FLARUM_ADMIN_USER: 'admin'
      FLARUM_ADMIN_PASS: '${FLARUM_ADMIN_PASSWORD}'
      FLARUM_ADMIN_MAIL: 'admin@flynode.io'
    expose:
      - '8888'
    volumes:
      - flarum-assets:/flarum/app/public/assets

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: 'mysql:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: 'flarum'
      MYSQL_USER: 'flarum'
      MYSQL_PASSWORD: '${FLARUM_DB_PASSWORD}'
    volumes:
      - flarum-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  flarum-assets:
  flarum-db-data:
